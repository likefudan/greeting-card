<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3eb"><title>贺卡管理 · like</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" type="module"></script></head><body><main><header><span>FOR SOMEONE SPECIAL</span><h1>把心意，留给一个人。</h1><p>为朋友创建专属二维码和链接。</p></header><section id="login"><h2>管理员登录</h2><p>输入 Telegram 私聊中收到的管理密码。</p><form id="login-form"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form></section><div id="manager" hidden><section><h2>创建新贺卡</h2><form id="create-form"><label for="name">收卡人的名字</label><input id="name" maxlength="60" placeholder="例如：小王" autocomplete="off" required><label>可以点击的按钮</label><div id="action-fields"></div><button class="subtle" id="add-action" type="button">＋ 添加按钮</button><label class="theme-label">选择卡片样式</label><div id="themes" role="radiogroup" aria-label="卡片样式"></div><button id="create" type="submit">生成专属贺卡 ↗</button></form><p class="hint">每张贺卡可重复使用，每次点击冷却一分钟。</p></section><section id="result" hidden><span class="tag">这份心意，准备好了</span><h2 id="result-name"></h2><img id="qr" width="256" height="256" alt="专属贺卡二维码"><input id="card-url" aria-label="专属链接" readonly><div class="row"><button id="copy" type="button">复制链接</button><a id="open-card" target="_blank" rel="noopener noreferrer">打开贺卡</a><a id="download">下载二维码 SVG</a></div><div class="row"><button id="export-pdf" type="button">导出打印 PDF</button><button id="export-png" type="button">导出高清 PNG</button></div><p class="hint">信用卡尺寸 85.6 × 54 mm · PDF 按实际大小 / 100% 打印，不要缩放。PNG 为 1712 × 1080 像素，请设置相同打印尺寸。</p><p class="hint">分享链接或二维码；朋友点击按钮后，你会收到 Telegram 通知。</p></section><section><h2>我的贺卡</h2><div id="cards"></div><button id="more" class="subtle" type="button" hidden>加载更多</button></section><button class="quiet" id="logout" type="button">退出管理</button></div><p id="status" role="status" aria-live="polite"></p></main></body></html>
